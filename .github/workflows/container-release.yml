name: Release containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release, without the leading v"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: tidal-dl-pro

jobs:
  release-containers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub publishing requires DOCKER_USERNAME and DOCKER_PASSWORD secrets." >&2
            exit 1
          fi

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          version = os.environ.get("REQUESTED_VERSION") or ""

          if ref_type == "tag":
              if not re.fullmatch(r"v\d+\.\d+\.\d+", ref_name):
                  raise SystemExit(f"Release tags must look like v1.0.0, got {ref_name}")
              version = ref_name.removeprefix("v")

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Release version must look like 1.0.0, got {version or '<empty>'}")

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          project_version = pyproject["project"]["version"]
          if project_version != version:
              raise SystemExit(
                  f"pyproject.toml version ({project_version}) must match release version ({version})"
              )

          major, minor, _patch = version.split(".")
          outputs = {
              "version": version,
              "tag": f"v{version}",
              "major": major,
              "minor": f"{major}.{minor}",
          }

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Lowercase image owner for GHCR
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.minor }}
            type=raw,value=${{ steps.release.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Tidal DL Pro web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          append_body: true
          files: |
            docker-compose.release.yml
          body: |
            ## Container images

            Multi-arch images (`linux/amd64`, `linux/arm64`) published to:

            ```bash
            # GitHub Container Registry
            docker pull ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            docker pull ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}:latest

            # Docker Hub
            docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ```

            ## Docker Compose

            Run the latest release:

            ```bash
            docker compose -f docker-compose.release.yml up -d
            ```

            Pin this release instead of tracking `latest`:

            ```bash
            APP_IMAGE=ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }} docker compose -f docker-compose.release.yml up -d
            ```
